<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SailsPedia - Player Guide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Wikipedia Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Linux+Libertine:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Initialize Master Data Object -->
    <script>
        window.ARTICLES_DATABASE = {};
    </script>

    <!-- Data Files from your /data folder -->
    <script src="data/ships.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #202122;
        }

        .wiki-title {
            font-family: 'Linux Libertine', 'Georgia', 'Times', serif;
            font-weight: normal;
        }

        .wiki-link {
            color: #0645ad;
            text-decoration: none;
            cursor: pointer;
        }

        .wiki-link:hover {
            text-decoration: underline;
        }

        .wiki-link.missing {
            color: #dd3333;
        }

        .wiki-h2 {
            font-family: 'Linux Libertine', 'Georgia', 'Times', serif;
            border-bottom: 1px solid #a2a9b1;
        }

        .infobox {
            border: 1px solid #a2a9b1;
            background-color: #f8f9fa;
            width: 100%;
            font-size: 0.85rem;
        }

        @media (min-width: 640px) {
            .infobox {
                width: 280px;
                float: right;
                margin-left: 1rem;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f6f6f6] text-gray-900">

    <header class="bg-white border-b border-[#a2a9b1] sticky top-0 z-40 px-4 py-2.5 shadow-xs">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <button id="mobile-menu-btn" class="md:hidden text-gray-600 hover:text-black p-1" aria-label="Toggle navigation menu">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div data-nav="Main Page" class="flex items-center space-x-2.5 cursor-pointer group">
                    <div>
                        <span class="wiki-title text-xl font-bold tracking-tight text-gray-900 group-hover:text-[#0645ad] transition">Sails<span class="text-[#0645ad]">Pedia</span></span>
                        <span class="block text-[10px] text-gray-500 uppercase tracking-widest font-semibold -mt-1">Player Guide</span>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative flex-1 max-w-md">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Search SailsPedia..." 
                           class="w-full pl-9 pr-8 py-1.5 text-xs bg-gray-50 border border-gray-300 rounded focus:bg-white focus:outline-none focus:border-[#36c] transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    <button id="clear-search-btn" class="hidden absolute right-2.5 top-2 text-gray-400 hover:text-gray-600 text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="search-results" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-300 rounded shadow-lg z-50 max-h-80 overflow-y-auto text-xs"></div>
            </div>
        </div>
    </header>

    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 flex gap-6">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="hidden md:block w-52 flex-shrink-0 text-xs text-gray-700 select-none">
            <div class="sticky top-20 space-y-4">
                <div class="bg-white p-3 rounded border border-gray-300 shadow-2xs">
                    <h3 class="font-bold text-gray-900 border-b border-gray-200 pb-1.5 mb-2 uppercase text-[10px] tracking-wider text-gray-500">Navigation</h3>
                    <ul class="space-y-2">
                        <li><a data-nav="Main Page" class="wiki-link flex items-center space-x-2"><i class="fa-solid fa-house w-4 text-center text-gray-400"></i><span>Main Page</span></a></li>
                        <li><a id="all-articles-btn" class="wiki-link flex items-center space-x-2"><i class="fa-solid fa-list-ul w-4 text-center text-gray-400"></i><span>All Articles</span></a></li>
                    </ul>
                </div>

                <!-- Categories Section -->
                <div class="bg-white p-3 rounded border border-gray-300 shadow-2xs">
                    <h3 class="font-bold text-gray-900 border-b border-gray-200 pb-1.5 mb-2 uppercase text-[10px] tracking-wider text-gray-500">Categories</h3>
                    <ul class="space-y-2">
                        <li><a data-category="Ships & Vessels" class="wiki-link flex items-center space-x-2"><i class="fa-solid fa-ship w-4 text-center text-gray-400"></i><span>Ships & Vessels</span></a></li>
                    </ul>
                </div>
            </div>
        </aside>

        <main class="flex-1 min-w-0 bg-white border border-[#a2a9b1] rounded p-5 sm:p-8 shadow-2xs">
            
            <!-- Article Header -->
            <div class="border-b border-[#a2a9b1] pb-3 mb-5">
                <h1 id="article-title" class="wiki-title text-2xl sm:text-3xl text-gray-900 leading-tight">Loading...</h1>
                <p id="article-subtitle" class="text-xs text-gray-500 mt-1 italic">From SailsPedia, the ultimate player guide</p>
            </div>

            <!-- Article Content Container -->
            <div id="article-content" class="text-sm leading-relaxed text-gray-800 space-y-4"></div>

        </main>
    </div>

    <script>
        const DEFAULT_ARTICLES = {
            "Main Page": {
                title: "Main Page",
                category: "System Overview",
                infobox: {
                    title: "Sails Overview",
                    caption: "Official Sails Wiki",
                    stats: {
                        "Developer": "Solo Developer",
                        "Platform": "PC / Web"
                    }
                },
                content: `== Welcome to SailsPedia ==
Welcome to **SailsPedia**, your resource for all *Sails* information!`
            }
        };

        const getArticlesDatabase = () => window.ARTICLES_DATABASE || DEFAULT_ARTICLES;

        let currentPage = "Main Page";

        function parseWikiMarkdown(text) {
            if (!text) return "";

            let html = escapeHtml(text);

            // Headings
            html = html.replace(/^==\s*(.*?)\s*==$/gm, '<h2 class="wiki-h2 text-xl font-bold text-gray-900 mt-6 mb-3 pb-1">$1</h2>');
            html = html.replace(/^===\s*(.*?)\s*===$/gm, '<h3 class="text-base font-bold text-gray-900 mt-4 mb-2">$1</h3>');

            // Images ![caption](url)
            html = html.replace(/!\[(.*?)\]\((.*?)\)/g, function(match, caption, url) {
                return `
                    <div class="my-4 p-2 bg-gray-50 border border-gray-200 rounded max-w-md mx-auto text-center">
                        <img src="${url}" alt="${caption}" class="w-full h-auto rounded border border-gray-200">
                        ${caption ? `<p class="text-xs text-gray-500 italic mt-1.5">${caption}</p>` : ''}
                    </div>
                `;
            });

            // Bold & Italics
            html = html.replace(/'''(.*?)'''/g, '<strong>$1</strong>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/''(.*?)''/g, '<em>$1</em>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Blockquotes
            html = html.replace(/^&gt;\s*(.*)$/gm, '<blockquote class="border-l-4 border-[#0645ad] pl-3 py-1 my-3 italic text-gray-700 bg-gray-50 rounded-r">$1</blockquote>');

            // Wiki Links [[Page Title]]
            html = html.replace(/\[\[(.*?)\]\]/g, function(match, target) {
                const trimmed = target.trim();
                const db = getArticlesDatabase();
                const exists = !!db[trimmed];
                const cls = exists ? "wiki-link" : "wiki-link missing";
                return `<a data-nav="${escapeHtml(trimmed)}" class="${cls}">${escapeHtml(trimmed)}</a>`;
            });

            // Bullet Lists
            html = html.replace(/^\*\s*(.*)$/gm, '<li class="ml-5 list-disc my-0.5">$1</li>');

            // Paragraph Line Breaks
            html = html.replace(/\n\n/g, '<br><br>');

            return html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderPage(pageKey) {
            currentPage = pageKey;
            const db = getArticlesDatabase();
            const article = db[pageKey];
            const contentEl = document.getElementById("article-content");
            const titleEl = document.getElementById("article-title");

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (!article) {
                titleEl.innerText = pageKey;
                contentEl.innerHTML = `
                    <div class="p-6 text-center bg-gray-50 border border-dashed border-gray-300 rounded my-4">
                        <i class="fa-solid fa-file-circle-xmark text-4xl text-gray-400 mb-2"></i>
                        <h3 class="font-bold text-gray-700 text-base mb-1">Page "${escapeHtml(pageKey)}" does not exist yet.</h3>
                        <p class="text-xs text-gray-500 max-w-md mx-auto">This article has not been added to your data files yet.</p>
                        <button onclick="renderPage('Main Page')" class="mt-4 px-3 py-1.5 bg-[#0645ad] text-white rounded text-xs font-bold hover:bg-blue-800 transition">
                            Back to Main Page
                        </button>
                    </div>
                `;
                return;
            }

            titleEl.innerText = article.title;

            let infoboxHtml = "";
            if (article.infobox) {
                let statsRows = "";
                if (article.infobox.stats) {
                    for (const [k, v] of Object.entries(article.infobox.stats)) {
                        statsRows += `
                            <tr class="border-t border-gray-200">
                                <th class="text-left font-bold py-1 px-2 bg-gray-100 text-gray-700 border-r border-gray-200">${escapeHtml(k)}</th>
                                <td class="py-1 px-2 text-gray-800">${escapeHtml(v)}</td>
                            </tr>
                        `;
                    }
                }

                infoboxHtml = `
                    <div class="infobox rounded shadow-2xs overflow-hidden mb-4">
                        <div class="bg-[#cedff2] font-bold text-center py-2 px-3 text-gray-900 border-b border-[#a2a9b1]">
                            ${escapeHtml(article.infobox.title || article.title)}
                        </div>
                        ${article.infobox.image ? `
                            <div class="p-2 bg-white text-center border-b border-gray-200">
                                <img src="${escapeHtml(article.infobox.image)}" alt="Article Photo" class="w-full h-40 object-cover rounded border border-gray-200">
                                ${article.infobox.caption ? `<p class="text-[11px] text-gray-500 italic mt-1">${escapeHtml(article.infobox.caption)}</p>` : ''}
                            </div>
                        ` : ''}
                        <table class="w-full text-xs">
                            <tbody>${statsRows}</tbody>
                        </table>
                    </div>
                `;
            }

            const parsedBody = parseWikiMarkdown(article.content);
            contentEl.innerHTML = infoboxHtml + parsedBody;
        }

        function showAllArticles() {
            const db = getArticlesDatabase();
            const keys = Object.keys(db).sort();
            const titleEl = document.getElementById("article-title");
            const contentEl = document.getElementById("article-content");

            titleEl.innerText = "All Articles Directory";

            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
            keys.forEach(key => {
                const art = db[key];
                html += `
                    <div class="p-3 bg-gray-50 border border-gray-200 rounded hover:border-blue-400 transition">
                        <a data-nav="${escapeHtml(key)}" class="wiki-link font-bold text-sm block">${escapeHtml(art.title)}</a>
                    </div>
                `;
            });
            html += `</div>`;

            contentEl.innerHTML = html;
        }

        function renderCategoryPage(categoryName) {
            const db = getArticlesDatabase();
            const titleEl = document.getElementById("article-title");
            const contentEl = document.getElementById("article-content");

            window.scrollTo({ top: 0, behavior: 'smooth' });

            titleEl.innerText = categoryName;

            const matches = Object.keys(db)
                .filter(key => db[key].category === categoryName)
                .sort((a, b) => a.localeCompare(b));

            if (matches.length === 0) {
                contentEl.innerHTML = `
                    <div class="p-6 text-center bg-gray-50 border border-dashed border-gray-300 rounded my-4">
                        <i class="fa-solid fa-folder-open text-3xl text-gray-400 mb-2"></i>
                        <p class="text-xs text-gray-500">No articles currently listed under <strong>${escapeHtml(categoryName)}</strong>.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <p class="text-xs text-gray-600 mb-5">Showing all entries listed under <span class="font-bold text-gray-800">${escapeHtml(categoryName)}</span>:</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            `;

            matches.forEach(key => {
                const article = db[key];
                const imgUrl = article.infobox?.image || "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600&auto=format&fit=crop&q=80";
                const summaryText = article.summary || extractSummaryText(article.content);

                html += `
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-2xs hover:shadow-md transition flex flex-col justify-between group">
                        <div>
                            <div class="h-36 overflow-hidden bg-gray-100 relative">
                                <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(article.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            </div>
                            <div class="p-3.5">
                                <h3 class="font-bold text-sm text-gray-900 group-hover:text-[#0645ad] transition mb-1">
                                    <a data-nav="${escapeHtml(key)}" class="cursor-pointer">${escapeHtml(article.title)}</a>
                                </h3>
                                <p class="text-xs text-gray-600 line-clamp-3 leading-relaxed">${escapeHtml(summaryText)}</p>
                            </div>
                        </div>
                        <div class="px-3.5 pb-3.5 pt-0">
                            <a data-nav="${escapeHtml(key)}" class="inline-flex items-center text-xs font-semibold text-[#0645ad] hover:underline cursor-pointer gap-1">
                                Read Article <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            contentEl.innerHTML = html;
        }

        function extractSummaryText(content) {
            if (!content) return "No summary available.";
            let clean = content
                .replace(/^==.*==$/gm, '')
                .replace(/\[\[(.*?)\]\]/g, '$1')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/''(.*?)''/g, '$1')
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .trim();
            return clean.substring(0, 130) + (clean.length > 130 ? '...' : '');
        }

        const searchInput = document.getElementById("search-input");
        const searchResults = document.getElementById("search-results");
        const clearSearchBtn = document.getElementById("clear-search-btn");

        searchInput.addEventListener("input", function() {
            const query = this.value.trim().toLowerCase();
            const db = getArticlesDatabase();

            if (query.length > 0) {
                clearSearchBtn.classList.remove("hidden");
                const matches = Object.keys(db).filter(k => 
                    k.toLowerCase().includes(query) || 
                    db[k].content.toLowerCase().includes(query)
                );

                if (matches.length === 0) {
                    searchResults.innerHTML = `<div class="p-3 text-gray-400 text-center">No matching articles found.</div>`;
                } else {
                    searchResults.innerHTML = matches.map(key => `
                        <div data-nav="${escapeHtml(key)}" class="p-2.5 hover:bg-blue-50 border-b border-gray-100 cursor-pointer flex justify-between items-center">
                            <div>
                                <div class="font-bold text-[#0645ad]">${escapeHtml(key)}</div>
                                <div class="text-[10px] text-gray-500">${escapeHtml(db[key].category)}</div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-300"></i>
                        </div>
                    `).join('');
                }
                searchResults.classList.remove("hidden");
            } else {
                clearSearchBtn.classList.add("hidden");
                searchResults.classList.add("hidden");
            }
        });

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            clearSearchBtn.classList.add("hidden");
            searchResults.classList.add("hidden");
        });

        document.addEventListener('click', (e) => {
            const catEl = e.target.closest('[data-category]');
            if (catEl) {
                e.preventDefault();
                const category = catEl.getAttribute('data-category');
                if (category) {
                    searchResults.classList.add("hidden");
                    document.getElementById("sidebar").classList.add("hidden");
                    renderCategoryPage(category);
                }
                return;
            }

            const navEl = e.target.closest('[data-nav]');
            if (navEl) {
                e.preventDefault();
                const target = navEl.getAttribute('data-nav');
                if (target) {
                    searchResults.classList.add("hidden");
                    document.getElementById("sidebar").classList.add("hidden");
                    renderPage(target);
                }
                return;
            }

            const allArticlesEl = e.target.closest('#all-articles-btn');
            if (allArticlesEl) {
                e.preventDefault();
                searchResults.classList.add("hidden");
                document.getElementById("sidebar").classList.add("hidden");
                showAllArticles();
            }
        });

        document.getElementById("mobile-menu-btn").addEventListener("click", () => {
            document.getElementById("sidebar").classList.toggle("hidden");
        });

        window.onload = function() {
            renderPage("Main Page");
        };
    </script>
</body>
</html>
